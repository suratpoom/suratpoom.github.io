<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F3B36">
<title>จัดยาโดยพญาบี v1.5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font:'Bai Jamjuree',system-ui,sans-serif;

  --bg:#F4F7F6;
  --card:#ffffff;
  --line:#E3E9E7;
  --line-soft:#EFF4F2;
  --line-input:#C9D6D2;

  --text:#10201D;
  --text-2:#5B6B67;
  --text-3:#8FA8A2;

  --teal:#0F766E;
  --teal-dark:#0a5a50;
  --teal-soft:#E0EFEC;
  --teal-row:#EFF7F5;

  --sidebar:#0F3B36;
  --sidebar-btn:#4FB3A9;
  --sidebar-text:#C3DCD7;
  --sidebar-label:#93BDB6;
  --sidebar-active:rgba(255,255,255,.14);
  --sidebar-hover:rgba(255,255,255,.08);

  --amber:#B45309;
  --amber-deep:#78350F;
  --amber-bg:#FEF3C7;
  --amber-line:#F5E3A6;
  --amber-row:#FFFBEB;
  --amber-person:#FBD38D;

  --line-green:#06C755;
  --req:#B91C1C;

  --fs-xs:11.5px;
  --fs-sm:12.5px;
  --fs-cap:13px;
  --fs-base:14px;
  --fs-md:15px;
  --fs-lg:16px;
  --fs-xl:21px;
  --fs-2xl:24px;
  --fs-3xl:30px;

  --sp-1:6px;
  --sp-2:8px;
  --sp-3:12px;
  --sp-4:16px;
  --sp-5:20px;
  --sp-6:24px;

  --r-sm:10px;
  --r-md:12px;
  --r-lg:14px;
  --r-xl:16px;
  --r-2xl:20px;

  --shadow-fab:0 6px 16px rgba(15,118,110,.35);
  --shadow-card:0 10px 30px rgba(15,59,54,.08);

  --z-sticky:100;
  --z-dropdown:1000;
  --z-modal:2000;
  --z-toast:3000;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button,input,textarea,select{font-family:var(--font);font-size:inherit;color:inherit}
img{display:block;max-width:100%}
a{color:var(--teal)}

.shell{min-height:100vh;min-height:100dvh;display:flex}
.content{flex:1;min-width:0;display:flex;flex-direction:column}
.wrap{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:22px 20px 130px}
.narrow{max-width:480px;margin:0 auto}
.mid{max-width:560px;margin:0 auto}
.wide{max-width:760px;margin:0 auto}

/* ───────── sidebar (desktop) ───────── */
.sidebar{
  width:232px;flex:none;background:var(--sidebar);color:#fff;
  padding:var(--sp-6) 14px;display:flex;flex-direction:column;gap:3px;
  position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;
}
.sidebar .logo{font-size:19px;font-weight:700;padding:0 var(--sp-3) 18px}
.nav-item{width:100%;text-align:left;background:transparent;border:0;
  border-radius:var(--r-md);padding:11px 14px;font-size:14.5px;cursor:pointer;color:var(--sidebar-text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item:hover{background:var(--sidebar-hover)}
.nav-item.on{background:var(--sidebar-active);color:#fff;font-weight:600}
.side-label{margin-top:18px;padding:0 var(--sp-3);font-size:var(--fs-xs);font-weight:600;color:var(--sidebar-label);letter-spacing:.8px}
.side-person{width:100%;text-align:left;background:transparent;border:0;
  display:flex;align-items:center;gap:var(--sp-2);padding:7px var(--sp-3);font-size:var(--fs-base);
  color:#fff;cursor:pointer;border-radius:var(--r-sm);min-width:0}
.side-person:hover{background:var(--sidebar-hover)}
.side-person.warn{color:var(--amber-person)}
.side-person span.nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-add{width:100%;text-align:left;background:transparent;border:0;border-radius:var(--r-sm);
  padding:9px var(--sp-3);font-size:var(--fs-base);color:var(--sidebar-text);cursor:pointer}
.side-add:hover{background:var(--sidebar-hover)}
.side-add:hover{color:#fff}
.side-cta{margin-top:auto;height:46px;border:0;border-radius:var(--r-md);background:var(--sidebar-btn);color:var(--sidebar);
  font-weight:700;font-size:var(--fs-md);display:flex;align-items:center;justify-content:center;cursor:pointer;width:100%}
.side-ver{padding:var(--sp-3) var(--sp-3) 0;font-size:var(--fs-xs);color:var(--sidebar-label);line-height:1.5}

/* ───────── avatars ───────── */
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;
  color:var(--sidebar);overflow:hidden;text-align:center;line-height:1}
.av.sq{border-radius:var(--r-md)}
.av img{width:100%;height:100%;object-fit:cover}

/* ───────── cards & bits ───────── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:var(--sp-5)}
.card.r20{border-radius:var(--r-2xl)}
.h-title{font-size:var(--fs-lg);font-weight:700}
.muted{color:var(--text-2)}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

.btn{border:0;cursor:pointer;font-family:var(--font);display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-1)}
.btn-line{background:var(--line-green);color:#fff;font-weight:700;border-radius:var(--r-sm);padding:10px 18px;font-size:13.5px}
.btn-line.block{width:100%;height:54px;border-radius:var(--r-xl);font-size:16.5px}
.btn-teal{background:var(--teal);color:#fff;font-weight:700;border-radius:var(--r-xl);height:52px;width:100%;font-size:17px}
.btn-ghost{background:var(--card);border:1px solid var(--line-input);border-radius:var(--r-sm);padding:10px 16px;font-size:13.5px;color:var(--text)}
.icon-btn{width:44px;height:44px;flex:none;border-radius:var(--r-md);background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--teal);cursor:pointer}
.btn[disabled]{opacity:.55;cursor:default}

.alert-bar{background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:var(--r-lg);
  padding:var(--sp-3) 18px;font-size:14.5px;color:var(--amber-deep);line-height:1.5}

.page-head{display:flex;align-items:center;gap:var(--sp-3)}
.page-head .t{font-size:var(--fs-lg);font-weight:600;min-width:0}

/* ───────── hero ───────── */
.hero{position:relative;border-radius:var(--r-2xl);overflow:hidden;background:var(--sidebar);
  box-shadow:var(--shadow-card)}
.hero img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.hero .scrim{position:absolute;inset:0;background:linear-gradient(95deg,rgba(15,59,54,.92) 0%,rgba(15,59,54,.72) 45%,rgba(15,59,54,.18) 100%)}
.hero .inner{position:relative;padding:22px 24px;color:#fff}
.hero .kicker{font-size:var(--fs-sm);font-weight:600;letter-spacing:.6px;color:#9FD6CE}
.hero h2{margin:6px 0 0;font-size:var(--fs-2xl);font-weight:700;line-height:1.25}
.hero p{margin:6px 0 0;font-size:13.5px;color:#CFE6E2;line-height:1.5}
.hero.desk{height:184px}
.hero.desk .inner{padding:26px 28px}
.hero.mob{height:138px}
.hero.mob .inner{padding:16px 18px}
.hero.mob h2{font-size:19px}
.hero.mob p{font-size:var(--fs-cap)}

.care{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);overflow:hidden}
.care .ph{height:112px;background:var(--teal-soft);position:relative}
.care .ph img{width:100%;height:100%;object-fit:cover}
.care .tx{padding:14px 18px;font-size:13.5px;color:var(--text-2);line-height:1.55}
.care .tx b{color:var(--text);display:block;font-size:var(--fs-base);margin-bottom:3px}

.empty{background:var(--card);border:1px solid var(--line);border-radius:var(--r-2xl);overflow:hidden;text-align:center}
.empty .ph{height:150px;background:var(--teal-soft)}
.empty .ph img{width:100%;height:100%;object-fit:cover;opacity:.92}
.empty .tx{padding:18px var(--sp-5) var(--sp-5)}
.empty .tx b{font-size:var(--fs-lg)}
.empty .tx p{margin:6px 0 14px;font-size:13.5px;color:var(--text-2);line-height:1.5}

/* ───────── stats ───────── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--sp-3)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:18px;
  text-align:left;width:100%;color:var(--text);font-family:var(--font)}
.stat .lb{font-size:var(--fs-sm);opacity:.75}
.stat .vl{font-size:var(--fs-3xl);font-weight:700;line-height:1.25;color:var(--teal)}
.stat .sb{font-size:var(--fs-sm);opacity:.7}
.stat.hot{background:var(--amber);border-color:var(--amber);color:#fff;cursor:pointer}
.stat.hot .vl{color:#fff}
.stat .lb,.stat .sb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ───────── table (desktop) ───────── */
.tbl-head,.tbl-row{display:grid;grid-template-columns:2fr .6fr 1.4fr 1fr .8fr;gap:var(--sp-2);align-items:center}
.tbl-head{padding:var(--sp-2) var(--sp-3);background:var(--bg);border-radius:var(--r-sm);
  font-size:12px;font-weight:600;color:var(--text-2)}
.tbl-row{padding:13px var(--sp-3);border-bottom:1px solid var(--line-soft);font-size:var(--fs-base);
  cursor:pointer;border-radius:var(--r-sm);width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-top:0}
.tbl-row:hover{background:var(--teal-row)}
.tbl-row.warn{background:var(--amber-row)}
.tbl-row>*{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ───────── refills ───────── */
.refill{display:flex;gap:var(--sp-3);align-items:flex-start}
.refill .dt{flex:none;width:46px;text-align:center;border-radius:var(--r-sm);padding:var(--sp-1) 0;background:var(--bg)}
.refill .dt.hot{background:var(--amber-bg)}
.refill .dt .d{font-size:var(--fs-lg);font-weight:700}
.refill .dt .m{font-size:10.5px}
.refill .tx{font-size:13.5px;line-height:1.45;min-width:0}

/* ───────── list cards (mobile) ───────── */
.row-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:var(--sp-3) 14px;
  display:flex;align-items:center;gap:var(--sp-3);cursor:pointer;width:100%;text-align:left}
.row-card:hover{border-color:var(--teal)}
.row-card .bd{flex:1;min-width:0}
.row-card .t1{font-size:var(--fs-md);font-weight:600}
.row-card .t2{font-size:var(--fs-cap);color:var(--text-2)}
.row-card .rt{font-size:12px;font-weight:600;flex:none;color:var(--teal)}
.row-card .rt.warn{color:var(--amber)}

.chk{width:26px;height:26px;border-radius:var(--r-sm);background:var(--card);border:1.5px solid var(--line-input);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:var(--fs-cap);flex:none}
.chk.on{background:var(--teal);border-color:var(--teal)}
.badge-warn{font-size:12px;font-weight:600;color:var(--amber);background:var(--amber-bg);
  padding:4px var(--sp-2);border-radius:var(--r-sm);flex:none}

.sec-label{margin-top:var(--sp-5);font-size:var(--fs-base);font-weight:600;color:var(--text-2);letter-spacing:.4px}

/* meal switch */
.meal-tabs{display:flex;gap:var(--sp-1);margin-top:var(--sp-2);overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.meal-tabs::-webkit-scrollbar{display:none}
.meal-tab{flex:1;min-width:72px;border:1px solid var(--line-input);background:var(--card);color:var(--text-2);
  border-radius:var(--r-md);padding:9px 0;font-size:var(--fs-cap);cursor:pointer;white-space:nowrap}
.meal-tab.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
.meal-tab .n{font-size:11px;opacity:.85;margin-left:4px}

/* ───────── people strip ───────── */
.people-strip{margin-top:var(--sp-5);display:flex;gap:var(--sp-3);align-items:flex-start;overflow-x:auto;padding-bottom:var(--sp-1)}
.people-strip::-webkit-scrollbar{display:none}
.p-cell{text-align:center;min-width:60px;cursor:pointer;background:none;border:0;padding:0;flex:none}
.p-cell .sub{font-size:12px;margin-top:4px;color:var(--text-2);max-width:66px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-cell .sub.warn{color:var(--amber);font-weight:600}
.p-dash{width:52px;height:52px;border-radius:50%;border:1.5px dashed var(--text-3);color:var(--teal);
  font-size:22px;display:flex;align-items:center;justify-content:center;margin:0 auto;background:none}

/* ───────── detail ───────── */
.med-photo{width:84px;height:84px;border-radius:var(--r-lg);background:var(--teal-soft);border:1.5px dashed var(--text-3);
  display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--teal);
  line-height:1.3;flex:none;overflow:hidden;cursor:pointer;padding:0}
.med-photo img{width:100%;height:100%;object-fit:cover}
.chip{font-size:var(--fs-cap);padding:4px var(--sp-2);border-radius:20px;white-space:nowrap}
.chip.person{background:var(--teal);color:#fff;font-weight:600}
.chip.tag{background:var(--teal-soft);color:var(--teal)}
.meal-chip{flex:1;text-align:center;font-size:var(--fs-cap);background:var(--bg);color:var(--text-3);
  padding:var(--sp-2) 0;border-radius:var(--r-md);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.meal-chip.on{background:var(--teal);color:#fff;font-weight:600}
.bar{margin-top:var(--sp-2);height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:8px;background:var(--teal);border-radius:4px}
.kv{display:flex;justify-content:space-between;gap:var(--sp-2);padding:var(--sp-3) 0;border-bottom:1px solid var(--line-soft);font-size:var(--fs-base)}
.kv:last-child{border-bottom:0}
.note-box{margin-top:var(--sp-1);background:var(--bg);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);
  font-size:var(--fs-base);line-height:1.5;white-space:pre-wrap;word-break:break-word}
.hist-row{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp-2) 14px;
  display:flex;justify-content:space-between;gap:var(--sp-2);font-size:var(--fs-cap)}

/* ───────── form ───────── */
.lbl{margin-top:var(--sp-4);font-size:var(--fs-base);font-weight:600}
.lbl i{color:var(--req);font-style:normal}
.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:13px var(--sp-4);font-size:var(--fs-md);outline:none}
.inp:focus{border-color:var(--teal)}
.inp.h52{height:52px;padding:var(--sp-3) 14px;font-weight:600}
textarea.inp{min-height:64px;resize:vertical;font-size:var(--fs-base)}
.dd-btn{width:100%;background:var(--card);border:1.5px solid var(--teal);border-radius:var(--r-lg);
  padding:13px var(--sp-4);display:flex;justify-content:space-between;align-items:center;gap:var(--sp-2);cursor:pointer;text-align:left}
.dd-btn .v{font-size:var(--fs-md);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-list{position:fixed;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  overflow:auto;max-height:260px;z-index:var(--z-dropdown);box-shadow:0 12px 30px rgba(15,32,29,.16)}
.dd-item{padding:var(--sp-3) var(--sp-4);font-size:var(--fs-base);border-bottom:1px solid var(--line-soft);cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-item:hover,.dd-item.hi{background:var(--teal-row)}
.dd-item.add{color:var(--teal);font-weight:600;border-bottom:0}
.pick{border:1px solid var(--line-input);background:var(--card);color:var(--text);border-radius:var(--r-md);
  padding:10px var(--sp-4);font-size:var(--fs-base);cursor:pointer;white-space:nowrap}
.pick.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
.pick.seg{flex:1;min-width:0;text-align:center;padding:var(--sp-3) 0;overflow:hidden;text-overflow:ellipsis}
.pick.seg3{font-size:var(--fs-cap);padding:11px 2px}
.danger-zone{margin-top:var(--sp-5);border-top:1px solid var(--line);padding-top:var(--sp-4)}
.btn-danger{width:100%;height:48px;border-radius:var(--r-md);background:var(--card);
  border:1px solid #F1C4C4;color:var(--req);font-size:var(--fs-md);font-weight:600}
.stock-btn{flex:1;min-width:0;padding:11px 4px;font-size:var(--fs-cap);border-radius:var(--r-md);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-item{padding:14px 0;border-bottom:1px solid var(--line-soft)}
.rf-item:last-child{border-bottom:0;padding-bottom:0}
.rf-top{display:flex;justify-content:space-between;gap:var(--sp-2);align-items:baseline}
.rf-sub{margin-top:3px;font-size:var(--fs-cap);color:var(--text-2)}
.rf-due{margin-top:var(--sp-2);border-radius:var(--r-md);padding:9px var(--sp-3);
  font-size:13.5px;font-weight:600;display:flex;justify-content:space-between;gap:var(--sp-2);align-items:center}
.rf-due.now{background:#FEE2E2;color:#991B1B}
.rf-due.soon{background:var(--amber-bg);color:var(--amber)}
.rf-due.ok{background:var(--teal-soft);color:var(--teal)}
.rf-due.none{background:var(--bg);color:var(--text-2);font-weight:400}
.rf-due span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.cal-bar{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);margin-top:var(--sp-4)}
.cal-bar .mo{font-size:var(--fs-lg);font-weight:700;text-align:center;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-nav{width:40px;height:40px;flex:none;border-radius:var(--r-md);background:var(--card);
  border:1px solid var(--line);color:var(--teal);font-size:18px;cursor:pointer}
.cal-dows{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:var(--sp-3)}
.cal-dows span{text-align:center;font-size:11.5px;font-weight:600;color:var(--text-3);padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:2px}
.cal-cell{position:relative;aspect-ratio:1/1;min-height:42px;border:1px solid var(--line);
  background:var(--card);border-radius:var(--r-sm);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:2px;font-family:var(--font)}
.cal-cell.empty{border:0;background:transparent;cursor:default}
.cal-cell .d{font-size:var(--fs-cap);color:var(--text);line-height:1}
.cal-cell.today{border-color:var(--teal);border-width:2px}
.cal-cell.today .d{color:var(--teal);font-weight:700}
.cal-cell.on{background:var(--teal);border-color:var(--teal)}
.cal-cell.on .d{color:#fff;font-weight:700}
.cal-dots{display:flex;gap:3px;height:6px;align-items:center}
.cal-dots i{width:6px;height:6px;border-radius:50%;display:block;flex:none}
.cal-dots i.out{background:var(--req)}
.cal-dots i.rf{background:var(--amber)}
.cal-cell.on .cal-dots i{box-shadow:0 0 0 1.5px #fff}
.cal-legend{display:flex;gap:var(--sp-4);flex-wrap:wrap;margin-top:var(--sp-3);
  font-size:var(--fs-cap);color:var(--text-2)}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.cal-legend i{width:8px;height:8px;border-radius:50%;display:block;flex:none}
.cal-ev{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:12px 14px;display:flex;align-items:center;gap:var(--sp-3);cursor:pointer;width:100%;text-align:left}
.cal-ev .bd{flex:1;min-width:0}
.cal-ev .tag{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:20px;flex:none;white-space:nowrap}
.cal-ev .tag.out{background:#FEE2E2;color:#991B1B}
.cal-ev .tag.rf{background:var(--amber-bg);color:var(--amber)}
.pav{width:46px;height:46px;border-radius:50%;border:1px solid var(--line-input);background:var(--card);
  display:flex;align-items:center;justify-content:center;font-weight:600;cursor:pointer;flex:none;overflow:hidden;padding:0}
.pav.on{background:var(--teal);border-color:var(--teal);color:#fff}
.pav.dash{border:1.5px dashed var(--text-3);color:var(--teal);font-size:20px}
.stepper{height:52px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);

.stepper button{width:38px;height:38px;border:0;border-radius:var(--r-sm);background:var(--bg);font-size:18px;cursor:pointer;flex:none}
.stepper b{font-size:17px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qty-box{height:52px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);

.qty-box input{width:100%;min-width:0;border:0;outline:none;font-size:var(--fs-lg);font-weight:700;background:transparent}
.drop-photo{margin-top:14px;border:1.5px dashed var(--text-3);border-radius:var(--r-lg);padding:18px;

.photo-prev{margin-top:14px;display:flex;gap:var(--sp-3);align-items:center;background:var(--card);

.photo-prev img{width:72px;height:72px;object-fit:cover;border-radius:var(--r-md);flex:none}

/* ───────── bottom tabs (mobile) ───────── */
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-around;

.tabbar .tb{text-align:center;color:var(--text-3);font-size:12px;min-width:56px;cursor:pointer;background:none;border:0;padding:0}
.tabbar .tb .ic{font-size:18px;line-height:1.3}
.tabbar .tb.on{color:var(--teal);font-weight:600}
.fab{width:56px;height:56px;border:0;border-radius:50%;background:var(--teal);color:#fff;font-size:26px;
  display:flex;align-items:center;justify-content:center;margin-top:-34px;box-shadow:var(--shadow-fab);cursor:pointer;flex:none}

/* ───────── toast / modal ───────── */
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--text);color:#fff;
  padding:var(--sp-3) 22px;border-radius:var(--r-md);font-size:var(--fs-base);z-index:var(--z-toast);
  max-width:calc(100vw - 32px);text-align:center;line-height:1.45;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.mask{position:fixed;inset:0;background:rgba(15,32,29,.45);z-index:var(--z-modal);
  display:flex;align-items:flex-end;justify-content:center;padding:var(--sp-4)}
@media(min-width:600px){.mask{align-items:center}}
.modal{background:var(--card);border-radius:var(--r-2xl);padding:var(--sp-5);width:100%;max-width:420px;

.modal h3{margin:0 0 var(--sp-1);font-size:18px}
.modal p.sub{margin:0 0 var(--sp-3);font-size:var(--fs-cap);color:var(--text-2)}
.modal .acts{display:flex;gap:var(--sp-2);margin-top:var(--sp-4)}
.modal .acts button{flex:1;height:48px;border-radius:var(--r-md);font-size:var(--fs-md);font-weight:600}
.modal .acts .ok{background:var(--teal);color:#fff;border:0}
.modal .acts .no{background:var(--card);border:1px solid var(--line-input);color:var(--text-2)}

.sync{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);color:var(--text-2)}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);flex:none}
.sync.off .dot{background:var(--amber)}
.sync.err .dot{background:var(--req)}

.gate{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
.gate-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-2xl);overflow:hidden;box-shadow:var(--shadow-card)}
.gate-hero{height:168px;position:relative;background:var(--sidebar)}
.gate-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gate-hero .scrim{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(15,59,54,.55) 0%,rgba(15,59,54,.92) 100%)}
.gate-hero .inner{position:absolute;left:0;right:0;bottom:0;padding:18px 22px;color:#fff}
.gate-hero .inner .lg{font-size:20px;font-weight:700}
.gate-hero .inner .sm{font-size:var(--fs-cap);color:#CFE6E2;margin-top:2px}
.gate-body{padding:22px}
.gate-body p{margin:0;font-size:var(--fs-base);color:var(--text-2);line-height:1.6}
.gate-btn{margin-top:18px;display:flex;justify-content:center;min-height:44px}
.gate-field{margin-top:var(--sp-2);position:relative}
.gate-field .inp{height:52px}
.gate-field .eye{position:absolute;right:6px;top:6px;height:40px;padding:0 12px;border:0;background:transparent;
  color:var(--teal);font-size:var(--fs-cap);font-weight:600;cursor:pointer;border-radius:var(--r-sm)}
.gate-lbl{margin-top:var(--sp-4);font-size:var(--fs-base);font-weight:600}
.gate-msg{margin-top:14px;background:var(--amber-bg);border:1px solid var(--amber-line);
  border-radius:var(--r-md);padding:12px 14px;font-size:13.5px;color:var(--amber-deep);line-height:1.55;word-break:break-word}
.gate-foot{margin-top:16px;text-align:center;font-size:var(--fs-sm);color:var(--text-3)}

.acct{display:flex;align-items:center;gap:var(--sp-2);min-width:0}
.acct .bd{min-width:0}
.acct .n{font-size:var(--fs-cap);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct .e{font-size:11.5px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-acct{margin-top:14px;padding:10px var(--sp-3);border-radius:var(--r-md);background:var(--sidebar-hover);
  color:#fff;cursor:pointer;border:0;width:100%;text-align:left}
.user-row{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:12px 14px;display:flex;align-items:center;gap:var(--sp-3)}
.user-row .bd{flex:1;min-width:0}
.role-chip{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:20px;flex:none;
  background:var(--teal-soft);color:var(--teal)}

@media print{
  .sidebar,.tabbar,.no-print{display:none!important}
  body{background:#fff}
  .wrap{padding:0;max-width:none}
  .card{border:0;box-shadow:none;padding:0}
}

<body>
<div id="app"></div>
<div id="layer"></div>
<div id="toast"></div>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════
   จัดยาโดยพญาบี (B-Med) v1.0
   แอปบันทึกการใช้ยาของสมาชิกในครอบครัว
   หลังบ้าน: Google Apps Script → Google Sheet + Google Drive (รูปฉลากยา)
   ══════════════════════════════════════════════════════════════ */

var VERSION  = 'v1.5';
var API_URL  = 'https://script.google.com/macros/s/AKfycbze89lJ0Kd7Wk0a8Hz2jNE2RGJcqOOE6ODVFDen_Va45AJqkVOI_RH2s0oH8rRwnUXV/exec';
var CACHE_KEY = 'bmed-cache-v1';
var QUEUE_KEY = 'bmed-queue-v1';
var AUTH_KEY  = 'bmed-auth-v1';
var USER_KEY  = 'bmed-lastuser';

var IMG = {
  hero : 'https://images.unsplash.com/photo-1563213126-a4273aed2016?auto=format&fit=crop&w=1400&q=70',
  care : 'https://images.unsplash.com/photo-1624711076872-ecdbc5ade023?auto=format&fit=crop&w=900&q=70',
  empty: 'https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&w=900&q=70'
};

var MEALS    = ['เช้า','กลางวัน','เย็น','ก่อนนอน'];
var TH_MON   = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
var TH_MON_F = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
var TH_DOW   = ['อา','จ','อ','พ','พฤ','ศ','ส'];
var TH_DAY   = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
var PALETTE  = ['#4FB3A9','#E6B35A','#9BC47E','#8FB6E0','#D89AB5','#C9A97E'];

/* ── state ─────────────────────────────────────────────────── */
var S = {
  view:'home', navStack:[], selId:null, selPerson:null,
  people:[], meds:[], taken:{}, takenDate:'',
  mealTab:'', sync:'loading', lastError:'',
  dd:false, ddHi:-1,
  form:null, saving:false, modal:null, desktop:window.innerWidth>=900,
  sid:'', user:null, gateMsg:'', gateBusy:false, gateUser:'', gateShowPw:false,
  users:null, sheetUrl:'', calMonth:'', calDay:''
};

var FREQS=[{v:'daily',label:'ทุกวัน'},{v:'weekly',label:'รายสัปดาห์'},{v:'asneeded',label:'เมื่อมีอาการ'}];

function blankForm(){
  return { editId:'', name:'', newName:false, person:'', meals:['เช้า'], dose:'', freq:'daily',
           qty:'', start:todayIso(), lead:7, note:'', photo:'', photoName:'', dirty:false };
}

/* เปิดฟอร์มในโหมดแก้ไข — เติมค่าจากยาที่เลือก */
function editForm(m){
  return { editId:m.id, name:m.name||'', newName:true, person:m.person||'',
           meals:sortMeals(m.meals||[]), dose:m.dose||1, freq:m.freq||'daily',
           qty:String(Math.round(remainingOf(m))), start:m.start||todayIso(),
           lead:m.lead||7, note:m.note||'', photo:'', photoName:'', dirty:false };
}
function openEditForm(id){
  var m=findMed(id); if(!m) return;
  S.navStack.push({view:S.view, selId:S.selId, selPerson:S.selPerson});
  if(S.navStack.length>20) S.navStack.shift();
  S.view='form'; S.dd=false; S.form=editForm(m);
  render(true);
  armHist();
}

/* ── date helpers (ใช้เวลาเครื่อง = Asia/Bangkok ไม่ใช่ UTC) ─── */
function isoOf(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayIso(){ return isoOf(new Date()); }
function parseIso(iso){ var p=String(iso||'').split('-'); return new Date(+p[0],(+p[1]||1)-1,+p[2]||1); }
function addDays(iso,n){ var d=parseIso(iso); d.setDate(d.getDate()+n); return isoOf(d); }
function validIso(iso){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(iso||''))) return false;
  var p=String(iso).split('-'), d=new Date(+p[0],+p[1]-1,+p[2]);
  return d.getFullYear()===+p[0] && d.getMonth()===+p[1]-1 && d.getDate()===+p[2];
}
function fmtTh(iso){
  if(!validIso(iso)) return '—';
  var d=parseIso(iso);
  return d.getDate()+' '+TH_MON[d.getMonth()]+' '+(d.getFullYear()+543);
}
function todayLabel(){
  var d=new Date();
  return TH_DAY[d.getDay()]+'ที่ '+fmtTh(todayIso());
}
function currentMeal(){
  var h=new Date().getHours();
  if(h<11) return 'เช้า';
  if(h<15) return 'กลางวัน';
  if(h<20) return 'เย็น';
  return 'ก่อนนอน';
}

/* ── med maths ─────────────────────────────────────────────── */
function unitOf(m){
  var n=String(m.name||'');
  if(/พ่น|สเปรย|inhal/i.test(n)) return 'หลอด';
  if(/น้ำ|ไซรัป|syrup|ขวด|หยอด/i.test(n)) return 'ขวด';
  return 'เม็ด';
}
function perDay(m){
  if(m.freq==='weekly')   return (m.dose||1)/7;
  if(m.freq==='asneeded') return 0;
  return (m.meals||[]).length*(m.dose||1);
}
/* คงเหลือ ณ วันนี้ = ยอดที่นับไว้ล่าสุด − ที่ควรกินไปแล้วตั้งแต่วันที่นับ
   (บันทึกครั้งเดียวตอนรับยา แล้วแอปหักให้เองทุกวัน ไม่ต้องรอให้ใครติ๊ก) */
function countedFrom(m){
  var c=String(m.counted_at||'');
  return validIso(c) ? c : String(m.start||'');
}
function daysSinceCount(m){
  var from=countedFrom(m);
  if(!validIso(from)) return 0;
  var a=parseIso(from), b=parseIso(todayIso());
  return Math.max(0, Math.round((b-a)/86400000));
}
function remainingOf(m){
  var base=Number(m.remaining||0), p=perDay(m);
  if(!(p>0)) return base;                       /* ยาตามอาการ — หักเองเท่านั้น */
  return Math.max(0, base - p*daysSinceCount(m));
}
function daysLeft(m){ var p=perDay(m); return p>0 ? Math.floor(remainingOf(m)/p) : null; }
function isWarn(m){ var d=daysLeft(m); return d!=null && d<=(m.lead||7); }
function outIso(m){ var d=daysLeft(m); return d==null?null:addDays(todayIso(),d); }
function refillIso(m){ var d=daysLeft(m); return d==null?null:addDays(todayIso(),Math.max(d-(m.lead||7),0)); }
function mealsText(m){
  if(m.freq==='weekly')   return 'สัปดาห์ละครั้ง';
  if(m.freq==='asneeded') return 'เมื่อมีอาการ';
  return sortMeals(m.meals||[]).join(' · ') || '—';
}
function sortMeals(a){ return a.slice().sort(function(x,y){ return MEALS.indexOf(x)-MEALS.indexOf(y); }); }
function daysText(m){ var d=daysLeft(m); return d==null?'—':(d+' วัน'+(isWarn(m)?' ⚠':'')); }
function remainText(m){ return fmtQty(remainingOf(m))+' '+unitOf(m); }
function fmtQty(n){ return String(Math.round(n)); }
/* อัตราการกิน — ยารายสัปดาห์บอกเป็นต่อสัปดาห์ ไม่งั้นปัดเป็น "วันละ 0" */
function rateText(m){
  if(m.freq==='weekly')   return 'สัปดาห์ละ '+(m.dose||1)+' '+unitOf(m);
  if(m.freq==='asneeded') return 'เมื่อมีอาการ';
  return 'วันละ '+fmtQty(perDay(m))+' '+unitOf(m);
}
/* วันที่ต้องไปเบิกยา = วันที่ยาหมด − จำนวนวันที่ตั้งให้เตือนล่วงหน้า */
function refillInDays(m){ var d=daysLeft(m); return d==null?null:Math.max(0,d-(m.lead||7)); }
function alertMeds(){ return S.meds.filter(isWarn).sort(byUrgency); }
function byUrgency(a,b){
  var da=daysLeft(a), db=daysLeft(b);
  if(da==null&&db==null) return String(a.name).localeCompare(String(b.name),'th');
  if(da==null) return 1;
  if(db==null) return -1;
  if(da!==db) return da-db;
  return String(a.name).localeCompare(String(b.name),'th');
}
function sortedMeds(){ return S.meds.slice().sort(byUrgency); }
function personColor(ch){
  var i=S.people.findIndex(function(p){ return p.char===ch; });
  return PALETTE[(i<0?0:i)%PALETTE.length];
}
function medsOf(ch){ return sortedMeds().filter(function(m){ return m.person===ch; }); }
function personLabel(p){ return p.name && p.name!==p.char ? p.name : p.char; }

/* ── tiny dom helpers ──────────────────────────────────────── */
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function el(id){ return document.getElementById(id); }
function avatar(ch,size,opt){
  opt=opt||{};
  var t=String(ch||'?'), fs=opt.fs||Math.round(size*0.42);
  if(t.length>2) fs=Math.round(fs*0.72);
  if(t.length>4) fs=Math.round(fs*0.8);
  var bg=opt.bg||personColor(ch), fg=opt.fg||'#0F3B36';
  var bd=opt.border?('border:'+opt.border+';'):'';
  return '<span class="av'+(opt.square?' sq':'')+'" style="width:'+size+'px;height:'+size+'px;background:'+bg+
         ';color:'+fg+';font-size:'+fs+'px;'+bd+'">'+esc(t)+'</span>';
}
function imgTag(src,alt,cls){
  return '<img src="'+esc(src)+'" alt="'+esc(alt||'')+'" loading="lazy" referrerpolicy="no-referrer" '+
         (cls?'class="'+cls+'" ':'')+'onerror="this.style.display=\'none\'">';
}

/* ── toast ─────────────────────────────────────────────────── */
var toastTimer=null;
function toast(msg){
  var t=el('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.classList.remove('on'); },2400);
}

/* ── storage ───────────────────────────────────────────────── */
function saveCache(){
  try{
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      people:S.people, meds:S.meds, taken:S.taken, takenDate:S.takenDate, at:Date.now()
    }));
  }catch(e){}
}
function loadCache(){
  try{
    var raw=localStorage.getItem(CACHE_KEY); if(!raw) return false;
    var c=JSON.parse(raw);
    S.people=c.people||[]; S.meds=c.meds||[];
    S.taken = (c.takenDate===todayIso()) ? (c.taken||{}) : {};
    S.takenDate=todayIso();
    return true;
  }catch(e){ return false; }
}
function loadAuth(){
  try{
    var a=JSON.parse(localStorage.getItem(AUTH_KEY)||'null');
    if(a && a.sid){ S.sid=a.sid; S.user=a.user||null; return true; }
  }catch(e){}
  return false;
}
function saveAuth(){
  try{ localStorage.setItem(AUTH_KEY, JSON.stringify({sid:S.sid, user:S.user})); }catch(e){}
}
function clearAuth(){
  S.sid=''; S.user=null; S.users=null;
  S.people=[]; S.meds=[]; S.taken={};
  try{ localStorage.removeItem(AUTH_KEY); localStorage.removeItem(CACHE_KEY); }catch(e){}
}
function forceLogout(msg){
  var had=!!S.sid;
  clearAuth();
  S.view='home'; S.navStack=[]; S.form=null; S.gateShowPw=false;
  try{ S.gateUser=localStorage.getItem(USER_KEY)||''; }catch(e){ S.gateUser=''; }
  S.gateMsg=msg||(had?'เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่':'');
  render(true);
}

function getQueue(){ try{ return JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]'); }catch(e){ return []; } }
function setQueue(q){ try{ localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }catch(e){} }
function pushQueue(job){ var q=getQueue(); q.push(job); if(q.length>50) q.shift(); setQueue(q); }

/* ── api ───────────────────────────────────────────────────── */
/* ❗ห้ามยิง GET ไป /exec จากหน้าเว็บคนละ origin — GAS ตอบ 302 ที่ไม่มี header
   Access-Control-Allow-Origin ทำให้ fetch ล้มเป็น "Failed to fetch"
   (เจอจริง 2026-09-19: ล็อกอิน/บันทึกผ่าน แต่โหลดข้อมูลกลับมาไม่ได้เลย)
   → ทุกเส้นใช้ POST + text/plain ซึ่งไม่โดน preflight และผ่าน CORS ปกติ */
function apiPost(payload){
  var body={};
  for(var k in payload) body[k]=payload[k];
  if(S.sid && !body.sid) body.sid=S.sid;
  return fetch(API_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},   /* text/plain = ไม่โดน CORS preflight ของ GAS */
    body:JSON.stringify(body)
  }).then(function(r){ return r.json(); });
}
function setSync(kind,msg){ S.sync=kind; S.lastError=msg||''; paintSync(); }
function paintSync(){
  var n=document.querySelectorAll('[data-sync]');
  for(var i=0;i<n.length;i++) n[i].outerHTML=syncHtml();
}
function syncHtml(){
  var cls='sync', tx='ซิงก์ Google Sheet แล้ว';
  if(S.sync==='loading'){ tx='กำลังโหลดจาก Google Sheet…'; }
  else if(S.sync==='queued'){ cls+=' off'; tx='บันทึกในเครื่องแล้ว · รอซิงก์'; }
  else if(S.sync==='error'){
    cls+=' err';
    tx='ต่อหลังบ้านไม่ได้ · ใช้ข้อมูลในเครื่อง'+(S.lastError?' ('+String(S.lastError).slice(0,70)+')':'');
  }
  return '<span class="'+cls+'" data-sync><i class="dot"></i>'+esc(tx)+'</span>';
}

/* ส่งงานขึ้นหลังบ้าน — ล้มเหลวก็เก็บเข้าคิวไว้ ไม่ให้ผู้ใช้เสียงาน */
function send(payload,opt){
  opt=opt||{};
  return apiPost(payload).then(function(res){
    if(res && res.ok){ setSync('ok'); if(opt.onOk) opt.onOk(res); return res; }
    if(res && res.code==='NOAUTH'){ forceLogout(); return res; }
    setSync('ok');                                   /* ต่อหลังบ้านติด แค่ถูกปฏิเสธ */
    if(!opt.quiet) toast((res && res.error) || 'บันทึกไม่สำเร็จ');
    return res || {ok:false};
  }).catch(function(err){                            /* ต่อเน็ตไม่ได้เท่านั้นถึงเข้าคิว */
    if(opt.noQueue){ throw err; }
    pushQueue(payload);
    setSync('queued');
    return {ok:false, queued:true, error:String(err&&err.message||err)};
  });
}
function flushQueue(){
  if(!getQueue().length) return Promise.resolve(false);
  var sent=0;
  function step(){
    var cur=getQueue();
    if(!cur.length) return Promise.resolve(sent>0);
    return apiPost(cur[0]).then(function(r){
      if(r && r.code==='NOAUTH') return sent>0;      /* ยังไม่ได้ล็อกอิน → เก็บคิวไว้ส่งหลังล็อกอิน */
      cur.shift(); setQueue(cur);          /* ได้คำตอบแล้ว (สำเร็จหรือถูกปฏิเสธ) → ทิ้งงานนี้ ไม่ส่งซ้ำ */
      if(r && r.ok) sent++;
      return step();
    }).catch(function(){ return sent>0; }); /* ต่อเน็ตไม่ได้ → เก็บไว้ทั้งคิว ลองใหม่รอบหน้า */
  }
  return step();
}
function reload(){
  if(!S.sid) return Promise.resolve(false);
  return apiPost({action:'load'}).then(function(res){
    if(res && res.code==='NOAUTH'){ forceLogout(); return false; }
    if(!res || !res.ok) throw new Error((res&&res.error)||'โหลดข้อมูลไม่สำเร็จ');
    if(res.user){ S.user=res.user; saveAuth(); }
    S.people = res.people||[];
    S.meds   = res.meds||[];
    S.taken  = res.taken||{};
    S.takenDate = res.today || todayIso();
    saveCache(); setSync('ok');
    return true;
  }).catch(function(err){
    setSync('error', String(err&&err.message||err));
    return false;
  });
}

/* ── navigation (stack) ────────────────────────────────────── */
/* ปุ่มย้อนกลับของเครื่อง (Android/เบราว์เซอร์) ต้องย้อน "หน้าในแอป" ไม่ใช่ออกจากแอป
   วิธี: วาง history entry ดักไว้ 1 อัน ตราบใดที่ยังมีหน้าให้ย้อน */
var histTrap=false, ignorePop=0;
function armHist(){
  if(histTrap) return;
  try{ history.pushState({bmed:1},''); histTrap=true; }catch(e){}
}
function consumeHist(){
  if(!histTrap) return;
  histTrap=false; ignorePop++;
  try{ history.back(); }catch(e){ ignorePop--; }
}
window.addEventListener('popstate',function(){
  if(ignorePop>0){ ignorePop--; return; }
  histTrap=false;
  if(!S.navStack.length) return;          /* ไม่มีหน้าให้ย้อนแล้ว → ปล่อยเบราว์เซอร์ออกไปตามปกติ */
  if(S.view==='form') S.form=null;
  doBack();
  if(S.navStack.length) armHist();
});

function go(view,extra){
  S.navStack.push({view:S.view, selId:S.selId, selPerson:S.selPerson});
  if(S.navStack.length>20) S.navStack.shift();
  S.view=view; S.dd=false;
  if(extra){ for(var k in extra) S[k]=extra[k]; }
  if(view==='form' && !S.form) S.form=blankForm();
  render(true);
  armHist();
}
function openForm(){                        /* ฟอร์ม = หน้าลึก → push แล้ว ✕ กลับที่เดิม */
  if(S.view==='form') return;
  S.navStack.push({view:S.view, selId:S.selId, selPerson:S.selPerson});
  if(S.navStack.length>20) S.navStack.shift();
  S.view='form'; S.dd=false; S.form=blankForm();
  render(true);
  armHist();
}
function navTo(view){                       /* เมนูหลัก = reset stack */
  if(view==='form'){ 
    if(S.view==='form' && S.form && S.form.dirty){ toast('กรอกฟอร์มค้างอยู่'); return; }
    openForm(); return;
  }
  if(S.view==='form' && S.form && S.form.dirty){
    confirmLeave(function(){ S.form=null; S.navStack=[]; S.view=view; S.dd=false; render(true); consumeHist(); });
    return;
  }
  S.navStack=[]; S.view=view; S.dd=false;
  render(true);
  consumeHist();
}
function back(){
  if(S.view==='form' && S.form && S.form.dirty){
    confirmLeave(function(){ S.form=null; popView(); });
    return;
  }
  if(S.view==='form') S.form=null;
  popView();
}
function popView(){
  doBack();
  if(!S.navStack.length) consumeHist();
}
function doBack(){
  var prev=S.navStack.pop();
  if(!prev) prev={view:'home', selId:null, selPerson:null};
  S.view=prev.view; S.selId=prev.selId; S.selPerson=prev.selPerson; S.dd=false;
  render(true);
}
function confirmLeave(fn){
  openModal({
    title:'ออกจากฟอร์ม?',
    sub:'ข้อมูลที่กรอกไว้จะไม่ถูกบันทึก',
    okText:'ออกเลย', cancelText:'กรอกต่อ',
    onOk:function(){ closeModal(); fn(); }
  });
}

/* ── share text ────────────────────────────────────────────── */
function shareText(meds){
  var lines=['ตารางเบิกยา — จัดยาโดยพญาบี ('+fmtTh(todayIso())+')',''];
  var byPerson={}, order=[];
  meds.slice().sort(function(a,b){ return refillRank(a)-refillRank(b); }).forEach(function(m){
    if(!byPerson[m.person]){ byPerson[m.person]=[]; order.push(m.person); }
    byPerson[m.person].push(m);
  });
  order.forEach(function(who){
    lines.push('— '+who+' —');
    byPerson[who].forEach(function(m){
      var d=daysLeft(m);
      lines.push('• '+m.name);
      lines.push('  '+mealsText(m)+(m.freq==='daily'?(' ครั้งละ '+(m.dose||1)+' '+unitOf(m)+' · '+rateText(m)):(' · '+rateText(m))));
      lines.push('  เหลือ '+remainText(m)+(d!=null?' · ยาหมด '+fmtTh(outIso(m)):''));
      lines.push('  ' + (d==null ? 'ยาใช้เมื่อมีอาการ — คำนวณวันเบิกไม่ได้'
        : (refillInDays(m)<=0 ? 'ถึงคิวเบิกแล้ว'
                              : 'เบิกภายใน '+fmtTh(refillIso(m))+' (อีก '+refillInDays(m)+' วัน)')));
      if(m.note) lines.push('  โน้ต: '+m.note);
      lines.push('');
    });
  });
  return lines.join('\n');
}
function share(meds){
  if(!meds || !meds.length){ toast('ยังไม่มีรายการยาให้ส่ง'); return; }
  var text=shareText(meds);
  if(S.desktop){
    var done=function(){ toast('คัดลอกรายละเอียดยาแล้ว — วางได้เลย'); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done,function(){ fallbackCopy(text); done(); });
    } else { fallbackCopy(text); done(); }
  }else{
    toast('เปิด LINE เพื่อส่งรายละเอียดยา…');
    var url='https://line.me/R/share?text='+encodeURIComponent(text);
    setTimeout(function(){ window.open(url,'_blank','noopener'); },400);
  }
}
function fallbackCopy(text){
  try{
    var ta=document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
  }catch(e){}
}

function doLogin(){
  if(S.gateBusy) return;
  var u=String((el('lg-user')||{}).value||'').trim();
  var pwEl=el('lg-pass');
  var pw=String((pwEl||{}).value||'');
  S.gateUser=u;
  if(!u){ S.gateMsg='กรุณาใส่ชื่อผู้ใช้'; renderGate(); return; }
  if(!pw){ S.gateMsg='กรุณาใส่รหัสผ่าน'; renderGate(); return; }

  S.gateBusy=true; S.gateMsg=''; renderGate();
  apiPost({action:'login', username:u, password:pw, agent:navigator.userAgent}).then(function(r){
    S.gateBusy=false;
    if(r && r.ok && r.sid){
      try{ localStorage.setItem(USER_KEY, u.toLowerCase()); }catch(e){}
      S.sid=r.sid; S.user=r.user||null; saveAuth();
      S.gateMsg=''; S.gateShowPw=false; S.view='home'; S.navStack=[];
      loadCache(); setSync('loading'); render(true);
      flushQueue().then(function(){ return reload(); }).then(function(){ render(); });
      return;
    }
    S.gateMsg=(r && r.error) || 'เข้าสู่ระบบไม่สำเร็จ';
    renderGate();
  }).catch(function(){
    S.gateBusy=false;
    S.gateMsg='ต่อหลังบ้านไม่ได้ · เช็คอินเทอร์เน็ตแล้วลองใหม่';
    renderGate();
  });
}

function doLogout(){
  closeModal();

  flushQueue().then(function(){
    return apiPost({action:'logout'}).catch(function(){ return null; });
  }).catch(function(){ return null; }).then(function(){
    try{ localStorage.removeItem(QUEUE_KEY); }catch(e){}
    forceLogout('ออกจากระบบแล้ว');

}

/* ── คิวเบิกยา ─────────────────────────────────────────────── */
/* refillIso = วันที่ยาหมด − จำนวนวันเตือนล่วงหน้า = วันที่ควรไปเบิก */
function refillRank(m){
  var d=refillInDays(m);
  return d==null ? 99999 : d;                 /* ยาตามอาการ คำนวณไม่ได้ → ไว้ท้ายสุด */
}
function refillState(m){
  var d=refillInDays(m);
  if(d==null) return 'none';
  if(d<=0)    return 'now';
  if(d<=7)    return 'soon';
  return 'ok';
}
function refillLine(m){
  var d=refillInDays(m);
  if(d==null) return { cls:'none', main:'คำนวณวันเบิกไม่ได้', right:'ยาใช้เมื่อมีอาการ' };
  if(d<=0)    return { cls:'now',  main:'ถึงคิวเบิกแล้ว', right:'ยาหมด '+fmtTh(outIso(m)) };
  return { cls:refillState(m), main:'เบิกภายใน '+fmtTh(refillIso(m)), right:'อีก '+d+' วัน' };
}

/* ── hero / care / empty ───────────────────────────────────── */
function heroKicker(){
  var due=0, left=0;
  S.meds.forEach(function(m){
    if(m.freq!=='daily') return;
    (m.meals||[]).forEach(function(ml){ due++; if(!S.taken[m.id+'-'+ml]) left++; });
  });
  if(!due)  return 'ยังไม่มียาที่ต้องกินประจำ';
  if(!left) return 'ติ๊กครบทุกมื้อแล้ววันนี้';
  return 'วันนี้ยังไม่ได้ติ๊ก ' + left + ' มื้อ จาก ' + due + ' มื้อ';
}
function heroHtml(mobile){
  return '<div class="hero '+(mobile?'mob':'desk')+'">'+
    imgTag(IMG.hero,'กล่องจัดยาประจำวัน')+
    '<div class="scrim"></div><div class="inner">'+
      '<div class="kicker">'+esc(heroKicker())+'</div>'+
      '<h2>'+(mobile?'จัดยาโดยพญาบี':'ภาพรวมยาของบ้าน')+'</h2>'+
      '<p>เช็คมื้อยา · นับเม็ดคงเหลือ · เตือนก่อนยาหมด</p>'+
    '</div></div>';
}

  var rows=sortedMeds().filter(function(m){ return daysLeft(m)!=null; }).slice(0,4);

        '<div style="margin-top:var(--sp-3);display:flex;flex-direction:column;gap:var(--sp-3)">';

function mealBlockHtml(){
  var meal=S.mealTab||currentMeal();
  var h='<div class="meal-tabs">';

    var n=S.meds.filter(function(m){ return m.freq==='daily' && (m.meals||[]).indexOf(ml)>=0; }).length;
    h+='<button class="meal-tab'+(ml===meal?' on':'')+'" data-act="meal" data-m="'+esc(ml)+'">'+
       esc(ml)+(n?'<span class="n">'+n+'</span>':'')+'</button>';

    h+='<div class="muted" style="font-size:13.5px;padding:var(--sp-2) 0">ไม่มียามื้อ'+esc(meal)+'</div>';

    h+='<div class="row-card" data-act="toggle" data-id="'+esc(m.id)+'" data-m="'+esc(meal)+'">'+

/* ── ปฏิทินยาหมด / วันเบิก ── */
/* map: 'YYYY-MM-DD' -> [{m, kind:'out'|'rf'}] */
function calEvents(){
  var map={};
  sortedMeds().forEach(function(m){
    if(daysLeft(m)==null) return;                 /* ยาตามอาการ คำนวณไม่ได้ */
    var out=outIso(m), rf=refillIso(m);
    if(out){ (map[out]=map[out]||[]).push({m:m, kind:'out'}); }
    if(rf && rf!==out){ (map[rf]=map[rf]||[]).push({m:m, kind:'rf'}); }
  });
  return map;
}
function calMonthOf(){ return S.calMonth || todayIso().slice(0,7); }

function calendarHtml(){
  var ym=calMonthOf(), y=+ym.slice(0,4), mo=+ym.slice(5,7);
  var ev=calEvents(), today=todayIso();
  var startDow=new Date(y,mo-1,1).getDay();
  var nDays=new Date(y,mo,0).getDate();

  var h='<div class="wide">'+
    '<div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:var(--sp-2)">'+
      '<div><div style="font-size:22px;font-weight:700">ปฏิทินยาหมด</div>'+
      '<div class="muted" style="font-size:13.5px;margin-top:2px">ยาของใครหมดวันไหน · ต้องไปเบิกวันไหน</div></div>'+
      '<button class="btn btn-ghost no-print" data-act="calToday">วันนี้</button></div>';

  h+='<div class="card" style="margin-top:14px">'+
     '<div class="cal-bar" style="margin-top:0">'+
       '<button class="cal-nav" data-act="calMove" data-n="-1" aria-label="เดือนก่อน">‹</button>'+
       '<div class="mo">'+esc(TH_MON_F[mo-1]+' '+(y+543))+'</div>'+
       '<button class="cal-nav" data-act="calMove" data-n="1" aria-label="เดือนถัดไป">›</button></div>'+
     '<div class="cal-dows">'+TH_DOW.map(function(d){ return '<span>'+d+'</span>'; }).join('')+'</div>'+
     '<div class="cal-grid">';

  for(var i=0;i<startDow;i++) h+='<div class="cal-cell empty"></div>';
  for(var day=1;day<=nDays;day++){
    var iso=ym+'-'+String(day).padStart(2,'0');
    var list=ev[iso]||[];
    var cls='cal-cell'+(iso===today?' today':'')+(iso===S.calDay?' on':'');
    var dots='';
    list.slice(0,3).forEach(function(x){ dots+='<i class="'+x.kind+'"></i>'; });
    h+='<button class="'+cls+'" data-act="calDay" data-d="'+iso+'" title="'+esc(fmtTh(iso))+'">'+
       '<span class="d">'+day+'</span>'+
       '<span class="cal-dots">'+dots+'</span></button>';
  }
  h+='</div>'+
     '<div class="cal-legend"><span><i style="background:var(--req)"></i>ยาหมด</span>'+
     '<span><i style="background:var(--amber)"></i>ต้องไปเบิก</span></div></div>';

  /* รายการข้างล่าง — เลือกวันแล้วโชว์เฉพาะวันนั้น ไม่เลือกโชว์ทั้งเดือน */
  var rows=[];
  Object.keys(ev).forEach(function(iso){
    if(S.calDay ? iso!==S.calDay : iso.slice(0,7)!==ym) return;
    ev[iso].forEach(function(x){ rows.push({iso:iso, m:x.m, kind:x.kind}); });
  });
  rows.sort(function(a,b){
    if(a.iso!==b.iso) return a.iso.localeCompare(b.iso);
    return a.kind===b.kind ? 0 : (a.kind==='rf'?-1:1);
  });

  h+='<div class="sec-label" style="margin-top:var(--sp-5)">'+
     esc(S.calDay ? fmtTh(S.calDay) : 'ทั้งเดือน '+TH_MON_F[mo-1])+' ('+rows.length+')'+
     (S.calDay?' · <button class="btn btn-ghost" data-act="calDay" data-d="" style="padding:4px 10px;font-size:var(--fs-sm)">ดูทั้งเดือน</button>':'')+
     '</div>';
  h+='<div style="margin-top:var(--sp-2);display:flex;flex-direction:column;gap:var(--sp-2)">';
  if(!rows.length){
    h+='<div class="card muted" style="font-size:var(--fs-base)">'+
       (S.calDay?'วันนี้ไม่มียาหมดหรือถึงคิวเบิก':'เดือนนี้ไม่มียาหมดหรือถึงคิวเบิก')+'</div>';
  }
  rows.forEach(function(r){
    h+='<button class="cal-ev" data-act="open" data-id="'+esc(r.m.id)+'">'+
       avatar(r.m.person,38)+
       '<div class="bd"><div class="one" style="font-size:var(--fs-md);font-weight:600">'+esc(r.m.name)+'</div>'+
       '<div class="one muted" style="font-size:var(--fs-cap)">'+
         esc(fmtTh(r.iso)+' · '+r.m.person+' · '+rateText(r.m))+'</div></div>'+
       '<span class="tag '+r.kind+'">'+(r.kind==='out'?'ยาหมด':'ต้องไปเบิก')+'</span></button>';
  });
  return h+'</div></div>';
}

/* dropdown ชื่อยา — render ที่ body (portal) กัน sticky/overflow ทับ */
function openDd(){
  closeDd();
  var btn=el('f-dd'); if(!btn) return;
  var names=[]; S.meds.forEach(function(m){ if(names.indexOf(m.name)<0) names.push(m.name); });
  names.sort(function(a,b){ return a.localeCompare(b,'th'); });
  var r=btn.getBoundingClientRect();
  var box=document.createElement('div');
  box.className='dd-list'; box.id='dd-list';
  box.style.left=r.left+'px'; box.style.width=r.width+'px';
  var below=window.innerHeight-r.bottom;
  if(below<180 && r.top>below){ box.style.bottom=(window.innerHeight-r.top+6)+'px'; }
  else { box.style.top=(r.bottom+6)+'px'; box.style.maxHeight=Math.max(140,below-16)+'px'; }
  var h='';
  names.forEach(function(n,i){
    h+='<div class="dd-item" data-act="ddPick" data-n="'+esc(n)+'" data-i="'+i+'">'+esc(n)+'</div>';
  });
  if(!names.length) h+='<div class="dd-item muted" style="cursor:default">ยังไม่มียาในระบบ</div>';
  h+='<div class="dd-item add" data-act="ddNew">＋ เพิ่มยาใหม่…</div>';
  box.innerHTML=h;
  el('layer').appendChild(box);
  S.dd=true; S.ddHi=-1;
}
function closeDd(){
  var b=el('dd-list'); if(b) b.parentNode.removeChild(b);
  S.dd=false; S.ddHi=-1;
}

function toggleTaken(id,meal){
  var m=findMed(id); if(!m) return;
  var k=id+'-'+meal, want=!S.taken[k];
  S.taken[k]=want;
  saveCache(); render();

     ติ๊ก = บันทึกว่ากินแล้ว ไว้ดูว่ากินครบไหม */

}

function receiveMed(id){
  var m=findMed(id); if(!m) return;

    title:'บันทึกรับยาเพิ่ม', sub:m.name+' — '+m.person,
    fields:[
      {id:'qty',   label:'จำนวนที่รับ ('+unitOf(m)+')', required:true, numeric:true, value:String(m.qty||30)},
      {id:'date',  label:'วันที่รับ (YYYY/MM/DD)', required:true, value:todayIso().replace(/-/g,'/')},

    ],

/* รูปฉลากยา: ย่อภาพก่อนส่ง (กว้างสุด 1200px, JPEG 0.72) */
function pickPhoto(cb){
  var inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.setAttribute('capture','environment');
  inp.style.display='none';
  document.body.appendChild(inp);
  inp.addEventListener('change',function(){
    var file=inp.files && inp.files[0];
    document.body.removeChild(inp);
    if(!file) return;
    if(!/^image\//.test(file.type)){ toast('เลือกได้เฉพาะไฟล์รูป'); return; }
    shrinkImage(file,1200,0.72).then(function(dataUrl){
      cb(dataUrl, file.name);
    }).catch(function(){ toast('อ่านไฟล์รูปไม่ได้'); });
  });
  inp.click();
}
function shrinkImage(file,maxW,q){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=rej;
    fr.onload=function(){
      var img=new Image();
      img.onerror=rej;
      img.onload=function(){
        var w=img.width, h=img.height;
        if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
        var c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        try{ res(c.toDataURL('image/jpeg',q)); }catch(e){ rej(e); }
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function saveMed(){
  if(S.saving) return;
  var f=S.form; if(!f) return;
  readFormInputs();

  if(!String(f.name).trim()){ toast('กรุณาใส่ชื่อยา'); focusField('f-name','f-dd'); return; }
  if(!f.person){ toast('กรุณาเลือกผู้ใช้ยา'); return; }
  if(f.freq==='daily' && !f.meals.length){ toast('กรุณาเลือกมื้อยาอย่างน้อย 1 มื้อ'); return; }
  var dose=parseInt(f.dose,10)||0;
  if(!dose){ toast('กรุณาใส่ว่ากินครั้งละกี่'+unitOf({name:f.name})); return; }
  var qtyRaw=String(f.qty).replace(/[^0-9]/g,'');
  if(qtyRaw===''){ toast(f.editId?'กรุณาใส่จำนวนคงเหลือ':'กรุณาใส่จำนวนที่ได้รับ'); focusField('f-qty'); return; }
  var qty=parseInt(qtyRaw,10)||0;
  if(!f.editId && !qty){ toast('จำนวนที่ได้รับต้องมากกว่า 0'); focusField('f-qty'); return; }
  var iso=String(f.start||'').replace(/\//g,'-');
  if(!validIso(iso)){ toast('กรุณาใส่วันเริ่มใช้เป็น YYYY/MM/DD'); focusField('f-start'); return; }

  var meals=(f.freq==='daily') ? sortMeals(f.meals) : [];

  /* ── โหมดแก้ไข ── */
  if(f.editId){
    var m=findMed(f.editId);
    if(!m){ toast('ไม่พบยานี้แล้ว'); return; }
    m.name=String(f.name).trim(); m.person=f.person; m.meals=meals;
    m.dose=dose; m.freq=f.freq; m.start=iso; m.lead=f.lead; m.note=f.note;
    m.remaining=qty; m.counted_at=todayIso();
    if(qty>(m.qty||0)) m.qty=qty;            /* นับใหม่ได้มากกว่ายอดฐาน → ขยับฐานตาม */
    if(f.photo) m.photo_url=f.photo;
    saveCache();

    var editId=f.editId, photo=f.photo||'';
    S.form=null; popView();                  /* กลับหน้าที่มา (รายละเอียดยา) */

    send({ action:'updateMed', id:editId, name:m.name, person:m.person, meals:meals,
           dose:m.dose, freq:m.freq, start:iso, remaining:String(qty), qty:String(m.qty),
           lead:m.lead, note:m.note, photo:photo }).then(function(res){
      if(res && res.ok){
        if(res.photo_url){ var mm=findMed(editId); if(mm) mm.photo_url=res.photo_url; saveCache(); render(); }
        toast('แก้ไขแล้ว · ซิงก์ Google Sheet');
      } else if(res && res.queued){
        toast('แก้ไขในเครื่องแล้ว · จะซิงก์ให้เมื่อเน็ตกลับมา');
      }
    });
    return;
  }

  /* ── โหมดเพิ่มใหม่ ── */
  S.saving=true; render();

  var tempId='TMP-'+Date.now();
  var med={
    id:tempId, name:String(f.name).trim(), person:f.person, meals:meals,
    dose:dose, freq:f.freq, start:iso, qty:qty, remaining:qty, counted_at:iso, lead:f.lead,
    tag:'', note:f.note, photo_url:f.photo||'',
    history:[{date:iso, qty:qty, place:'บันทึกเอง'}]
  };
  S.meds.push(med); saveCache();

  var payload={action:'addMed', name:med.name, person:med.person, meals:meals, dose:med.dose,
               freq:med.freq, start:iso, qty:qty, lead:med.lead, note:med.note,
               photo:f.photo||'', place:'บันทึกเอง'};

  S.form=null; S.saving=false; S.navStack=[]; S.view='home'; render(true); consumeHist();

  send(payload).then(function(res){
    if(res && res.ok){
      var mm=findMed(tempId);
      if(mm){ mm.id=res.id||tempId; if(res.photo_url) mm.photo_url=res.photo_url; }
      saveCache();
      toast('บันทึกแล้ว · ซิงก์ Google Sheet');
      return reload().then(function(){ render(); });
    }
    if(res && res.queued) toast('บันทึกในเครื่องแล้ว · จะซิงก์ให้เมื่อเน็ตกลับมา');
  });
}

/* หยุดยา — ซ่อนจากรายการ แต่ประวัติในชีทยังอยู่ (active=0) */
function useDoseModal(id,reason){
  var m=findMed(id); if(!m) return;
  var isUse=reason!=='discard';
  openModal({
    title: isUse?'บันทึกว่าใช้ไปแล้ว':'บันทึกการตัดทิ้ง',
    sub: m.name+' — '+m.person+' · ตอนนี้เหลือ '+remainText(m),
    fields:[
      {id:'qty',  label:'จำนวนที่'+(isUse?'ใช้ไป':'ตัดทิ้ง')+' ('+unitOf(m)+')', required:true, numeric:true},
      {id:'date', label:'วันที่ (YYYY/MM/DD)', required:true, value:todayIso().replace(/-/g,'/')}
    ],
    okText:'บันทึก',
    onOk:function(v){
      var q=parseInt(String(v.qty).replace(/[^0-9]/g,''),10)||0;
      if(!q){ toast('กรุณาใส่จำนวน'); return false; }
      if(q>remainingOf(m)){ toast('มากกว่าที่เหลืออยู่ ('+remainText(m)+')'); return false; }
      var iso=String(v.date||'').replace(/\//g,'-');
      if(!validIso(iso)){ toast('วันที่ต้องเป็น YYYY/MM/DD'); return false; }

      closeModal();
      m.remaining=Math.max(0,remainingOf(m)-q);
      m.counted_at=todayIso();
      m.adjust=([{date:iso, qty:q, kind:isUse?'ใช้เอง':'จำหน่ายทิ้ง'}]).concat(m.adjust||[]);
      saveCache(); render();
      toast((isUse?'บันทึกใช้ไป ':'ตัดทิ้ง ')+q+' '+unitOf(m)+' แล้ว');
      send({action:'useDose', med_id:id, qty:q, date:iso, reason:isUse?'use':'discard'});
      return true;
    }
  });
}

function confirmDelMed(id){
  var m=findMed(id); if(!m) return;
  openModal({
    title:'หยุดยาตัวนี้?',
    sub:m.name+' — '+m.person+' จะหายจากรายการและการแจ้งเตือน · ประวัติรับยายังอยู่ในชีท',
    okText:'หยุดยา', cancelText:'ยกเลิก',
    onOk:function(){
      closeModal();
      S.meds=S.meds.filter(function(x){ return String(x.id)!==String(id); });
      Object.keys(S.taken).forEach(function(k){ if(k.indexOf(id+'-')===0) delete S.taken[k]; });
      saveCache();
      S.form=null; S.selId=null;
      navTo('home');
      toast('หยุดยา '+m.name+' แล้ว');
      send({action:'deleteMed', id:id});
      return true;
    }
  });
}

/* ══════════════════════════════════════════════════════════════
   EVENTS
   ══════════════════════════════════════════════════════════════ */
document.addEventListener('click',function(ev){
  if(!ev.target || !ev.target.closest) return;
  var t=ev.target.closest('[data-act]');
  if(!t){
    if(S.dd && !ev.target.closest('#f-dd')) closeDd();
    return;
  }
  var a=t.dataset.act;

  /* dropdown ปิดทุกครั้งที่กดอย่างอื่น */
  if(S.dd && a!=='ddPick' && a!=='ddNew' && a!=='ddToggle') closeDd();

  switch(a){
    case 'nav':      navTo(t.dataset.v); break;
    case 'go':       go(t.dataset.v); break;
    case 'back':     back(); break;
    case 'open':     readFormInputs(); go('detail',{selId:t.dataset.id}); break;
    case 'person':   go('person',{selPerson:t.dataset.ch}); break;
    case 'meal':     S.mealTab=t.dataset.m; render(); break;
    case 'calDay':   S.calDay=(S.calDay===t.dataset.d)?'':t.dataset.d; render(); break;
    case 'calMove': {
      var ym=calMonthOf(), yy=+ym.slice(0,4), mm=+ym.slice(5,7)+(+t.dataset.n);
      var dd=new Date(yy, mm-1, 1);
      S.calMonth=dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0');
      S.calDay=''; render(); break;
    }
    case 'calToday': S.calMonth=todayIso().slice(0,7); S.calDay=todayIso(); render(); break;
    case 'toggle':   toggleTaken(t.dataset.id, t.dataset.m); break;
    case 'addPerson':readFormInputs(); addPerson(); break;
    case 'receive':  receiveMed(t.dataset.id); break;
    case 'useDose':  useDoseModal(t.dataset.id, t.dataset.r); break;
    case 'print':    window.print(); break;
    case 'account':  openAccountSheet(); break;
    case 'logout':   doLogout(); break;
    case 'goUsers':  closeModal(); S.users=null; go('users'); fetchUsers(); break;
    case 'setStatus': confirmSetStatus(t.dataset.u, t.dataset.ok==='1'); break;
    case 'login':    doLogin(); break;
    case 'showPw':   S.gateShowPw=!S.gateShowPw;
                     S.gateUser=String((el('lg-user')||{}).value||'').trim();
                     var pv=String((el('lg-pass')||{}).value||'');
                     renderGate();
                     if(el('lg-pass')){ el('lg-pass').value=pv; el('lg-pass').focus(); }
                     break;

    case 'shareAll':    share(sortedMeds()); break;
    case 'shareRefill': share(sortedMeds().filter(function(m){ return refillInDays(m)!=null; })); break;
    case 'shareAlerts': share(alertMeds()); break;
    case 'shareOne':    share([findMed(t.dataset.id)].filter(Boolean)); break;
    case 'sharePerson': share(medsOf(t.dataset.ch)); break;

    /* form */
    case 'ddToggle':   readFormInputs(); if(S.dd) closeDd(); else openDd(); break;
    case 'ddPick':     S.form.name=t.dataset.n; S.form.dirty=true; closeDd(); render(); break;
    case 'ddNew':      S.form.newName=true; S.form.name=''; closeDd(); render();
                       setTimeout(function(){ focusField('f-name'); },30); break;
    case 'pickMode':   readFormInputs(); S.form.newName=false; render(); break;
    case 'pickPerson': readFormInputs(); S.form.person=t.dataset.ch; S.form.dirty=true; render(); break;
    case 'toggleMeal': {
      readFormInputs();
      var ml=t.dataset.m, i=S.form.meals.indexOf(ml);
      if(i>=0) S.form.meals.splice(i,1); else S.form.meals.push(ml);
      S.form.dirty=true; render(); break;
    }
    case 'dose': {
      readFormInputs();
      var dd=+t.dataset.d, cur=parseInt(S.form.dose,10);
      if(isNaN(cur)){ if(dd>0) S.form.dose=1; }      /* ว่างอยู่: กด ＋ ได้ 1 · กด − ยังว่างเหมือนเดิม */
      else S.form.dose=Math.max(1,cur+dd);
      S.form.dirty=true; render(); break;
    }
    case 'lead':  readFormInputs(); S.form.lead=+t.dataset.n; S.form.dirty=true; render(); break;
    case 'freq':  readFormInputs(); S.form.freq=t.dataset.f; S.form.dirty=true; render(); break;
    case 'editMed': openEditForm(t.dataset.id); break;
    case 'delMed':  confirmDelMed(t.dataset.id); break;
    case 'save':  saveMed(); break;
    case 'photoPick': readFormInputs(); pickPhoto(function(url,name){
        S.form.photo=url; S.form.photoName=name; S.form.dirty=true; render();
        toast('แนบรูปฉลากยาแล้ว');
      }); break;
    case 'photoClear': readFormInputs(); S.form.photo=''; S.form.photoName=''; render(); break;
    case 'photoMed': {
      var id=t.dataset.id;
      pickPhoto(function(url){
        var m=findMed(id); if(!m) return;
        m.photo_url=url; saveCache(); render();
        toast('กำลังอัปโหลดรูปขึ้น Google Drive…');
        send({action:'updateMed', id:id, photo:url}).then(function(res){
          if(res && res.ok && res.photo_url){
            var mm=findMed(id); if(mm) mm.photo_url=res.photo_url;
            saveCache(); render(); toast('อัปโหลดรูปฉลากยาแล้ว');
          }
        });
      });
      break;
    }

    /* modal */
    case 'maskClose':   if(ev.target.classList.contains('mask')) closeModal(); break;
    case 'modalCancel': closeModal(); break;
    case 'modalOk':     submitModal(); break;
  }
});

function submitModal(){
  var cfg=S.modal; if(!cfg || !cfg.onOk) return;
  var v={};
  (cfg.fields||[]).forEach(function(f){ var n=el('m-'+f.id); v[f.id]=n?n.value:''; });
  cfg.onOk(v);
}

/* enter/esc ใน modal + esc ปิด dropdown */
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'){
    if(S.dd){ closeDd(); return; }
    if(S.modal){ closeModal(); return; }
  }
  if(ev.key==='Enter' && S.modal && ev.target.tagName==='INPUT'){ ev.preventDefault(); submitModal(); }
  if(ev.key==='Enter' && !S.sid && ev.target && (ev.target.id==='lg-user'||ev.target.id==='lg-pass')){
    ev.preventDefault(); doLogin();
  }
});

/* พิมพ์ในฟอร์ม — เก็บค่าไว้ในสเตตโดยไม่ re-render (ไม่งั้น focus หลุด) */
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t && t.id==='lg-user'){ S.gateUser=t.value; return; }
  if(!S.form) return;
  if(t.id==='f-name'){ S.form.name=t.value; S.form.dirty=true; }
  else if(t.id==='f-note'){ S.form.note=t.value; S.form.dirty=true; }
  else if(t.id==='f-qty'){
    var c=t.value.replace(/[^0-9]/g,'').slice(0,5);
    if(c!==t.value) t.value=c;
    S.form.qty=c; S.form.dirty=true;
  }
  else if(t.id==='f-start'){
    var atEnd = t.selectionStart===t.value.length;
    var d=t.value.replace(/[^0-9]/g,'').slice(0,8), out=d;
    if(d.length>6) out=d.slice(0,4)+'/'+d.slice(4,6)+'/'+d.slice(6);
    else if(d.length>4) out=d.slice(0,4)+'/'+d.slice(4);
    if(atEnd && out!==t.value){ t.value=out; t.setSelectionRange(out.length,out.length); }
    S.form.start=t.value.replace(/\//g,'-'); S.form.dirty=true;
  }
});

/* dropdown ต้องตามปุ่มตอน scroll/resize — ปิดไปเลยง่ายและไม่หลุดตำแหน่ง */
window.addEventListener('scroll',function(){ if(S.dd) closeDd(); },true);
window.addEventListener('resize',function(){
  if(S.dd) closeDd();
  var d=window.innerWidth>=900;
  if(d!==S.desktop){ readFormInputs(); S.desktop=d; render(); }
});

/* กลับมาที่แอป → ถ้าข้ามวันแล้วให้ล้างการติ๊กของเมื่อวาน + ดึงข้อมูลใหม่ */
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible') return;
  if(S.takenDate!==todayIso()){ S.taken={}; S.takenDate=todayIso(); S.mealTab=''; saveCache(); render(); }
  syncUp();
});
window.addEventListener('online',syncUp);

function syncUp(){
  flushQueue().then(function(){ return reload(); }).then(function(ok){ if(ok && S.view!=='form') render(); });
}

function afterRender(){
  if(S.view==='form' && S.form){
    var f=S.form;
    var n=el('f-name');  if(n && n.value!==f.name) n.value=f.name;
    var q=el('f-qty');   if(q && q.value!==f.qty) q.value=f.qty;
    var t=el('f-note');  if(t && t.value!==f.note) t.value=f.note;
  }
}

/* ── boot ──────────────────────────────────────────────────── */
(function boot(){
  S.takenDate=todayIso();
  S.mealTab=currentMeal();
  loadAuth();
  if(!S.sid){                                   /* ไม่มีสิทธิ์ = ไม่เก็บข้อมูลยาไว้ในเครื่อง */
    try{ localStorage.removeItem(CACHE_KEY); }catch(e){}
    try{ S.gateUser=localStorage.getItem(USER_KEY)||''; }catch(e){}
    renderGate(); return;
  }
  loadCache();
  S.form=null;
  setSync(navigator.onLine===false?'error':'loading');
  render();
  flushQueue().then(function(){ return reload(); }).then(function(){ render(); });
})();
</script>
</body>
